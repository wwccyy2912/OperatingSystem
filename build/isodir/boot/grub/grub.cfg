set timeout=10
set default=0

insmod all_video
insmod gfxterm
insmod serial
serial --unit=0 --speed=115200

# gfxterm cannot initialize without a loaded font; without it GRUB
# silently falls back to the text console and gfxpayload never applies.
loadfont /boot/grub/fonts/unicode.pf2
# Force a linear RGB framebuffer (not VGA text): the kernel's
# SYS_FB_GET_INFO/SYS_FB_MAP path and the user-space term service
# exercise the linear-framebuffer rendering path.
set gfxmode=1024x768x32
set gfxpayload=keep
terminal_input serial console
terminal_output serial gfxterm

menuentry "OpSys" {
        insmod multiboot2
        multiboot2 /boot/kernel.elf
        boot
}

menuentry "Diagnostics: videoinfo" {
        videoinfo
        halt
}
